<rcf>
    <!--
      One agent, started on the engine host itself. No host is named, and
      an unnamed host means "here": the agent is launched directly rather
      than over a remote login.

      This suite scans the machine the agent runs on, so on localhost the
      device under test is the build container. That is the point for a
      demonstration suite and the thing to change first for a real one:
      name a host here and the same tests look at that host instead.
    -->
    <ta name="Agt_A" type="linux" rcflib="rcfunix">
        <conf name="port">${TE_RCF_PORT:-50000}</conf>
        <conf name="copy_timeout">60</conf>
        <conf name="kill_timeout">30</conf>
    </ta>
</rcf>
