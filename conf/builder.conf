# The engine and the agent are built for the same platform: the agent runs
# on the engine host. Every library in this suite works through a job
# factory, and a job factory needs an agent, so unlike the template this
# suite has a real one.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external libraries under test. Their references live in
# conf/external.yml and the commits actually built in
# conf/builder.conf.lock.
#
# The order matters only to a reader: tapi_kernel is built on
# tapi_devtool, tapi_cybersec on tapi_kernel, and tapi_fuzz, tapi_tls
# and tapi_container on tapi_cybersec. tapi_container is the one that
# does not build on tapi_devtool: it wraps tapi_job itself.
TE_EXT_REPO_USE([tsf_devtool], [], [tapi_devtool])
TE_EXT_REPO_USE([tsf_kernel], [], [tapi_kernel])
TE_EXT_REPO_USE([tsf_cybersec], [], [tapi_cybersec])
TE_EXT_REPO_USE([tsf_printing], [], [tapi_print])

TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# The traffic rules of tapi_sniffrules capture TCP and UDP over IPv4 and
# IPv6 on an Ethernet interface, which is what these layers are for.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# The agent side of the traffic engine takes the same protocol list as
# the test side; without it the build picks the full default set.
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# RPC servers are served by this application rather than by the agent
# itself, because it links the job library. Every library in this suite
# reads what a command printed, which needs output channels, and only
# the RPC job factory has them - so without this application the suite
# does not work at all.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
